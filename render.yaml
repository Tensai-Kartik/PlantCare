services:
  - type: web
    name: plantcare-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: DEFAULT_MODEL
        value: efficientnet_b0
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-flash-latest,gemini-flash-lite-latest,gemini-3.7-flash,gemini-3.6-flash
      - key: GEMINI_VISION_MODE
        value: always
      - key: FRONTEND_URL
        value: https://plantcare.vercel.app
      - key: GEMINI_API_KEY
        sync: false
